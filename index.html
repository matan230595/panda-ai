      :root {

        height: 100%;

        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {

        background: rgba(255, 255, 255, 0.1);

      .markdown-content ul { list-style-type: disc; padding-right: 20px; margin-top: 8px; margin-bottom: 8px; }

      .markdown-content strong { font-weight: 700; color: white; }
      .markdown-content p { margin-bottom: 8px; line-height: 1.7; }
      .markdown-content p:last-child { margin-bottom: 0; }
      .markdown-content a { color: #f97316; text-decoration: underline; }
      .markdown-content a:hover { color: #fb923c; }
